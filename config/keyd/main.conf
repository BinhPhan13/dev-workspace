# symlink this to /etc/keyd/<name>.conf
[ids]

*

[global]
overload_tap_timeout = 150

[main]
capslock = overload(control, esc)
# esc = capslocks

# copilot key
leftmeta+leftshift+f23 = capslock

leftshift = overload(shift, delete)
rightalt = overload(shift, enter)
leftalt = overload(alt, backspace)

space = overloadt(custom, space, 200)
[custom:C]
k = up
j = down
h = left
l = right

. = end
, = home
] = pagedown
[ = pageup

; = enter
b = A-backspace

leftshift = swap(CS)
[CS:C-S]


