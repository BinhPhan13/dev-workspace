onboarding = false

[ui]
prompt_new_tab_name = false

agent_panel_sort = "priority"
[keys]
prefix = "alt+a"
split_vertical = "prefix+\\"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "prefix+alt+g"
description = "run lazygit"
command = "lazygit"
type = "popup"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+t"
description = "open terminal"
command = "bash"
type = "popup"
width = "80%"
height = "80%"

